# What this collector targets, and where it runs.
#   plugin:    does the target plugin itself run on this platform (at the version below)
#   collector: does this collector jar run there — yes | untested | no
#     yes: checked on a real server by the core's testkit (./gradlew integrationTest)
#     untested: expected to load (Bukkit API), never checked on that server
#     folia: no until plugin.yml declares folia-supported: true
minecraft: 1.21.11
core: v0.5.0
plugin:
  name: PacketEvents
  compiled-against: 2.13.0
  latest-for-minecraft: 2.13.0
  source: https://modrinth.com/plugin/packetevents
platforms:
  paper: { plugin: yes, collector: yes }
  spigot: { plugin: yes, collector: yes }
  bukkit: { plugin: yes, collector: yes }
  folia: { plugin: yes, collector: yes }
  purpur: { plugin: yes, collector: yes }
  sponge: { plugin: yes, collector: no }
  bungeecord: { plugin: yes, collector: no }
  geyser: { plugin: unknown, collector: no }
  velocity: { plugin: yes, collector: yes }
  waterfall: { plugin: yes, collector: no }
