# PacketEvents metrics: network traffic and client version.
#
# One jar, one integration. Removing it removes these metrics and nothing else;
# if it crashes, it crashes alone. That's what "depend" guarantees: without the
# core or without PacketEvents, Bukkit doesn't load this plugin and says so
# clearly, instead of letting a collector fail silently on every scrape.
name: VaniaMetrics-PacketEvents
version: ${version}
main: fr.samflix.vaniametrics.module.packetevents.PacketEventsPaper
api-version: '1.21'
authors: [mc-vania]
description: "PacketEvents metrics: network traffic and client version."
depend: [VaniaMetrics, packetevents]
folia-supported: true
